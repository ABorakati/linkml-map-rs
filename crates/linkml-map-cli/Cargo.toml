[package]
name = "linkml-map-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "linkml-tr-rs"
path = "src/main.rs"

[features]
# Parquet and DuckDB output (compiles DuckDB; off by default). Forwarded to linkml-map-io.
columnar = ["linkml-map-io/columnar", "dep:linkml-map-duckdb", "linkml-map-duckdb/columnar"]

[dependencies]
linkml-map-core      = { path = "../linkml-map-core" }
linkml-map-io        = { path = "../linkml-map-io" }
linkml-map-pipeline  = { path = "../linkml-map-pipeline" }
linkml-map-schemaview = { path = "../linkml-map-schemaview" }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Only for reading Parquet/DuckDB output back in the `columnar` tests.
linkml-map-duckdb = { path = "../linkml-map-duckdb", optional = true }

[dev-dependencies]
serde_yaml_ng = { workspace = true }
tempfile = { workspace = true }
tokio    = { workspace = true }
