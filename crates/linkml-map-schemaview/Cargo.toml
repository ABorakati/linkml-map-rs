[package]
name = "linkml-map-schemaview"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
linkml-map-core = { path = "../linkml-map-core" }
# LinkML metamodel + SchemaView, from the public Kapernikov/rust-linkml-core (v0.5.0)
# workspace (pinned for reproducibility). Replaces the previous local path deps
# so the repo builds from a clean clone.
schemaview = { git = "https://github.com/Kapernikov/rust-linkml-core", rev = "7bd81d586b75f03aa521591bef4ffcecf08305a9", default-features = false, features = [] }
linkml_meta = { git = "https://github.com/Kapernikov/rust-linkml-core", rev = "7bd81d586b75f03aa521591bef4ffcecf08305a9" }
serde_yaml = "0.9"
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
indexmap = { workspace = true }
