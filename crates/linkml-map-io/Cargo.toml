[package]
name = "linkml-map-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
linkml-map-core = { path = "../linkml-map-core" }
tokio = { workspace = true }
futures = { workspace = true }
csv-async = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
anyhow = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }

linkml-map-duckdb = { path = "../linkml-map-duckdb", optional = true }

[features]
# Parquet and DuckDB output via DuckDB (compiles DuckDB; off by default).
columnar = ["dep:linkml-map-duckdb", "linkml-map-duckdb/columnar"]

[dev-dependencies]
tempfile = "3"
