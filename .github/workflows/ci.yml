name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Weekly deep runs (every other job is skipped on this trigger): property tests
  # and cargo-fuzz targets (`proptest-long`, `fuzz`) and a randomised differential
  # run against upstream Python (`differential`).
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      fuzz_minutes:
        description: 'Minutes per fuzz target'
        default: '10'

jobs:
  harness-gate:
    if: github.event_name != 'schedule'
    # Fails when a changed crates/** path has no owner in harness-ownership.toml,
    # or when the public Rust API / PyO3 binding changed without the Python
    # surface (.pyi / shim / docs). Bypass a single change with [skip-harness]
    # in the commit message. Same code path as the in-session Stop hook.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Determine base ref
      id: base
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
        else
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
        fi

    - name: Harness sync gate
      run: cargo xtask harness-gate --base "${{ steps.base.outputs.ref }}"

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    # NOTE: this job installs upstream `linkml` + `linkml-map` on purpose — it
    # runs the UPSTREAM-REFERENCE compliance suite (tests/compliance/
    # test_compliance_suite.py imports linkml_map.compiler/.datamodel/.inference,
    # which only upstream provides). The PyO3 wheel is built here for packaging,
    # but the binding surface is proven separately in the `python-compat` job
    # below, which must NOT co-install upstream. Do not conflate the two.
    - name: Install Python dependencies
      run: |
        uv pip install pytest linkml-runtime pyyaml deepdiff linkml linkml-map --system

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    # Sanctioned no-Python-env fallback: linkml-map-py is excluded here and gets
    # its real coverage from the `python-compat` job.
    - name: Run Rust workspace tests
      run: cargo test --workspace --exclude linkml-map-py

    - name: Build Python wheels
      uses: PyO3/maturin-action@v1
      with:
        command: build
        args: --release --out dist -m crates/linkml-map-py/Cargo.toml

    - name: Install Python bindings
      run: |
        uv pip install dist/*.whl --system

    # LOAD-BEARING: our own wheel now ships a `linkml_map` compat shim
    # package (crates/linkml-map-py/pyproject.toml's [tool.maturin] include)
    # at the SAME import path as upstream `linkml-map`. Installing it above
    # clobbers upstream's `linkml_map/*` files already on disk from the
    # "Install Python dependencies" step. This job's compliance suite needs
    # the OPPOSITE — genuine upstream `linkml_map` — so re-assert it here,
    # after our wheel install. The binding's own `linkml_map` shim is proven
    # separately by the `python-compat` job (clean venv, no upstream never
    # co-installed), not here.
    - name: Re-assert upstream linkml-map (our wheel's shim clobbers it)
      run: |
        uv pip install --force-reinstall --no-deps linkml-map --system

    - name: Run upstream-reference compliance tests
      run: |
        pytest tests/compliance/test_compliance_suite.py

  # ───────────────────────────────────────────────────────────────────────────
  # Drop-in Python API compatibility of the PyO3 bindings.
  #
  # This job is the ONLY thing in CI that actually exercises the compiled
  # `linkml_map_rs` wheel + the Rust-backed `linkml_map` shim. It builds the
  # wheel, installs it into a CLEAN environment, and drives it through the
  # byte-identical-to-Python golden corpus (crates/linkml-map-py/tests/
  # test_compat_api.py). If the PyO3 surface drifts, this job fails the build.
  #
  # LOAD-BEARING INVARIANT — DO NOT "helpfully" add `linkml` or `linkml-map` to
  # the pip install below. Upstream `linkml-map` also imports as `linkml_map`,
  # so co-installing it would make `import linkml_map` resolve to UPSTREAM
  # Python instead of this repo's Rust shim, and the wheel would silently NOT be
  # under test. The compat deps are EXACTLY: pytest pyyaml linkml-runtime.
  # (The test module also actively guards against upstream leaking in and will
  # skip the whole module if it detects upstream's compiler/datamodel/inference
  # submodules — but keep this env clean regardless.)
  #
  # REQUIRED-CHECK NOTE: a GitHub check only *blocks merges* if a repo admin
  # adds it to the master branch-protection required-checks list. The check
  # names produced by this job are "python-compat (3.11)",
  # "python-compat (3.12)" and "python-compat (3.13)" (job id `python-compat`,
  # matrixed on python-version).
  # The YAML here only guarantees the job RUNS unconditionally on every PR and
  # FAILS on drift; it cannot make itself "required" — that is a branch-
  # protection setting.
  # ───────────────────────────────────────────────────────────────────────────
  python-compat:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ceiling is set by PyO3, not by pyproject.toml: pyo3 0.23.5 (pinned in
        # the workspace) supports CPython up to 3.13 and hard-errors when the
        # interpreter is NEWER than its maximum, so a 3.14 entry would fail at
        # build time, not test time. Upstream linkml-map now tests 3.14
        # (302ed8eff8); matching that needs a pyo3 bump (3.14 support landed in
        # PyO3 #4811, after 0.23.5) — do that first, then add '3.14' here.
        #
        # The wheel is NOT abi3 (crates/linkml-map-py/Cargo.toml has no abi3
        # feature), so maturin builds one version-specific wheel per entry and
        # every listed interpreter must be independently supported by pyo3.
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    # EXACTLY the compat deps — NO upstream `linkml` / `linkml-map` here.
    # See the load-bearing invariant in the job comment above.
    - name: Install compat dependencies (NO upstream linkml-map)
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pyyaml linkml-runtime

    - name: Build the PyO3 wheel
      uses: PyO3/maturin-action@v1
      with:
        command: build
        args: --release --out dist -m crates/linkml-map-py/Cargo.toml

    - name: Install the wheel under test
      run: |
        python -m pip install dist/*.whl

    - name: Run PyO3 drop-in compat tests
      run: |
        pytest crates/linkml-map-py/tests/test_compat_api.py -v

  # ───────────────────────────────────────────────────────────────────────────
  # Property tests (proptest) run in the `test` job above like any other test, at
  # their default case counts. This job repeats them at a much higher count.
  # ───────────────────────────────────────────────────────────────────────────
  proptest-long:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Property tests, many cases
      run: |
        set -euo pipefail
        PROPTEST_CASES=20000 cargo test -p linkml-map-core \
          --test proptest_expr --test proptest_spec --test proptest_value --test proptest_yaml
        PROPTEST_CASES=2000 cargo test -p linkml-map-io --test proptest_roundtrip
        PROPTEST_CASES=300 cargo test -p linkml-map-pipeline \
          --test proptest_pipeline --test proptest_spec_mutation --test proptest_multiblock

  # ───────────────────────────────────────────────────────────────────────────
  # Coverage-guided fuzzing (cargo-fuzz / libFuzzer, nightly). Targets live in
  # fuzz/fuzz_targets; they need no Python. The corpus is seeded from the repo's
  # fixtures (fuzz/seed.sh) and carried between runs through the Actions cache. A crash
  # fails the job and its reproducer is uploaded as an artifact. The fuzzers skip the
  # already-reported crashes (deep nesting, huge list repetition, Decimal exponent
  # overflow); build with `--features unguarded` to see those again.
  # ───────────────────────────────────────────────────────────────────────────
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - expr_parse_eval
          - spec_load_compile
          - yaml_safe_load
          - loader_yaml
          - loader_jsonl
          - loader_tsv
          - decimal_parse
          - writers_tabular
          - pyyaml_emit
    env:
      FUZZ_MINUTES: ${{ github.event.inputs.fuzz_minutes || '10' }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup nightly Rust
      uses: dtolnay/rust-toolchain@nightly

    - name: Cache cargo-fuzz and build output
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/cargo-fuzz
          ~/.cargo/registry
          fuzz/target
        key: fuzz-build-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml', 'Cargo.lock') }}
        restore-keys: fuzz-build-${{ runner.os }}-

    - name: Install cargo-fuzz
      run: command -v cargo-fuzz || cargo install cargo-fuzz --locked

    - name: Restore corpus
      uses: actions/cache@v4
      with:
        path: fuzz/corpus/${{ matrix.target }}
        key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
        restore-keys: fuzz-corpus-${{ matrix.target }}-

    - name: Seed corpus from fixtures
      run: ./fuzz/seed.sh

    - name: Fuzz ${{ matrix.target }} for ${{ env.FUZZ_MINUTES }} minutes
      run: |
        cargo +nightly fuzz run -a ${{ matrix.target }} -- \
          -max_total_time=$((FUZZ_MINUTES * 60)) -max_len=2048 -rss_limit_mb=2048 -timeout=30

    - name: Minimise the corpus for the cache
      if: success()
      run: cargo +nightly fuzz cmin ${{ matrix.target }} || true

    - name: Upload crashes
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashes-${{ matrix.target }}
        path: fuzz/artifacts/${{ matrix.target }}
        if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # differential: Rust CLI vs real upstream Python linkml-map, end to end.
  #
  # Upstream is installed from its own uv.lock at the PINNED TAG into its own
  # venv (upstream/.venv), separate from `test` (which installs unpinned
  # upstream with pip) and from `python-compat` (which must stay upstream-free).
  # The job runs (1) the deterministic examples sweep and (2) a Hypothesis
  # campaign: time-boxed (~5 min, fixed seed) on PRs, longer and randomly seeded
  # on the weekly schedule. Counterexamples (shrunk, with upstream's expected
  # output) are uploaded as artefacts. Known divergences are listed in
  # tests/differential/known_sweep_divergences.txt and in the corpus
  # (expected_divergence.md); only NEW divergences fail the job. The corpus
  # replay itself runs without Python in `cargo test` (test job).
  # ───────────────────────────────────────────────────────────────────────────
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4

    - name: Checkout upstream linkml-map at the pinned tag
      uses: actions/checkout@v4
      with:
        repository: linkml/linkml-map
        ref: v0.6.0-rc1
        path: upstream/linkml-map

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install upstream linkml-map (frozen lock) + hypothesis into its own venv
      working-directory: upstream/linkml-map
      run: |
        uv sync --frozen
        uv pip install --python .venv/bin/python 'hypothesis==6.170.0'

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Build the Rust CLI
      run: cargo build --release -p linkml-map-cli

    - name: Examples sweep
      env:
        UPSTREAM_PY: ${{ github.workspace }}/upstream/linkml-map/.venv/bin/python
        UPSTREAM_DIR: ${{ github.workspace }}/upstream/linkml-map
        LINKML_TR_RS: ${{ github.workspace }}/target/release/linkml-tr-rs
      run: tests/differential/run.sh --examples --fail-on-diff --report "$RUNNER_TEMP/examples_report.md"

    - name: Hypothesis campaign
      env:
        UPSTREAM_PY: ${{ github.workspace }}/upstream/linkml-map/.venv/bin/python
        UPSTREAM_DIR: ${{ github.workspace }}/upstream/linkml-map
        LINKML_TR_RS: ${{ github.workspace }}/target/release/linkml-tr-rs
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          SEED="${{ github.run_id }}"; BUDGET=3000
        else
          SEED=1; BUDGET=300
        fi
        tests/differential/run.sh --fuzz 1000000 --seed "$SEED" --time-budget "$BUDGET" \
          --corpus "$RUNNER_TEMP/counterexamples" --fail-on-diff --known-from-corpus --avoid-known

    - name: Upload counterexamples and reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: differential-results
        path: |
          ${{ runner.temp }}/counterexamples
          ${{ runner.temp }}/examples_report.md
        if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # Expression-level differential fuzzing against upstream linkml-map.
  #
  # Self-contained: upstream v0.6.0-rc1 goes into its OWN venv (never the venv
  # that runs the wheel-compat job, which must stay upstream-free), and the Rust
  # side is the `expr_oracle` example. Three checks:
  #   1. corpus replay: tests/differential/expr/corpus/*.jsonl against the stored
  #      upstream results (plain `cargo test`, no Python);
  #   2. a fixed-seed Hypothesis campaign (restricted + unrestricted) over the
  #      `clean` grammar profile; any divergence that classes.py cannot name fails;
  #   3. leaf oracles (float repr, json.dumps, str methods, ...) that must stay
  #      clean. Known divergences live in the corpus (`status: divergence`) and in
  #      tests/differential/expr/classes.py; shrink the `clean` profile as they are fixed.
  # ───────────────────────────────────────────────────────────────────────────
  expr-differential:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Install upstream linkml-map v0.6.0-rc1 (isolated venv) and Hypothesis
      run: |
        python -m venv "$RUNNER_TEMP/upvenv"
        "$RUNNER_TEMP/upvenv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/upvenv/bin/python" -m pip install \
          "git+https://github.com/linkml/linkml-map@v0.6.0-rc1" \
          simpleeval==1.0.8 asteval==1.0.10 python-slugify==9.1.3 text-unidecode==1.3 \
          inflection==0.5.1 hypothesis==6.170.12

    - name: Corpus replay (stored upstream results, no Python)
      run: cargo test -p linkml-map-conformance --test expr_differential

    - name: Build the Rust oracle
      run: cargo build -p linkml-map-conformance --example expr_oracle --release

    - name: Fixed-seed differential campaign (clean profile)
      env:
        EXPR_ORACLE: ${{ github.workspace }}/target/release/examples/expr_oracle
      run: |
        cd tests/differential/expr
        for mode in restricted unrestricted; do
          "$RUNNER_TEMP/upvenv/bin/python" campaign.py run --n 3000 --seed 7 --mode "$mode" \
            --profile clean --fail-on-unclassified --reps 2 --out "$RUNNER_TEMP/expr-diff-$mode"
        done

    - name: Leaf oracles that must stay clean
      env:
        EXPR_ORACLE: ${{ github.workspace }}/target/release/examples/expr_oracle
      run: |
        cd tests/differential/expr
        "$RUNNER_TEMP/upvenv/bin/python" leaf.py --n 4000 --seed 7 --show 2 \
          --only truthy,bool,strip,lstrip,rstrip,replace,split,join,substr,strlen,max,min,sorted,len \
          --expect-clean truthy,bool,strip,lstrip,rstrip,replace,split,join,substr,strlen,max,min,sorted,len
