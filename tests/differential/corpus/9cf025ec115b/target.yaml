name: personinfo
description: Information about people, based on [schema.org](http://schema.org)
id: https://w3id.org/linkml/examples/personinfo
imports:
- linkml:types
license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  CODE:
    prefix_prefix: CODE
    prefix_reference: http://example.org/code/
  GEO:
    prefix_prefix: GEO
    prefix_reference: http://example.org/geoloc/
  GSSO:
    prefix_prefix: GSSO
    prefix_reference: http://purl.obolibrary.org/obo/GSSO_
  P:
    prefix_prefix: P
    prefix_reference: http://example.org/P/
  ROR:
    prefix_prefix: ROR
    prefix_reference: http://example.org/ror/
  famrel:
    prefix_prefix: famrel
    prefix_reference: https://example.org/FamilialRelations#
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  personinfo:
    prefix_prefix: personinfo
    prefix_reference: https://w3id.org/linkml/examples/personinfo/
  prov:
    prefix_prefix: prov
    prefix_reference: http://www.w3.org/ns/prov#
  rdfs:
    prefix_prefix: rdfs
    prefix_reference: http://www.w3.org/2000/01/rdf-schema#
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
emit_prefixes:
- rdf
- rdfs
- xsd
- skos
default_curi_maps:
- semweb_context
default_prefix: personinfo
default_range: string
subsets:
  basic_subset:
    name: basic_subset
    description: A subset of the schema that handles basic information
enums:
  DiagnosisType:
    name: DiagnosisType
  FamilialRelationshipType:
    name: FamilialRelationshipType
    permissible_values:
      CHILD_OF:
        text: CHILD_OF
        meaning: famrel:05
      PARENT_OF:
        text: PARENT_OF
        meaning: famrel:02
      SIBLING_OF:
        text: SIBLING_OF
        meaning: famrel:01
  GenderType:
    name: GenderType
    permissible_values:
      None:
        text: None
        meaning: GSSO:000283
      cisgender man:
        text: cisgender man
        meaning: GSSO:000371
      cisgender woman:
        text: cisgender woman
        meaning: GSSO:000385
      nonbinary man:
        text: nonbinary man
        meaning: GSSO:009254
      nonbinary woman:
        text: nonbinary woman
        meaning: GSSO:009253
      transgender man:
        text: transgender man
        meaning: GSSO:000372
      transgender woman:
        text: transgender woman
        meaning: GSSO:000384
slots:
  address_of:
    name: address_of
    range: Agent
  age:
    name: age
    range: string
    pattern: \d+ \S+
  agents:
    name: agents
    range: Agent
    multivalued: true
    inlined: true
    inlined_as_list: true
  birth_date:
    name: birth_date
    slot_uri: schema:birthDate
    range: date
  city:
    name: city
  current_address:
    name: current_address
    description: The address at which a Agent currently lives
    range: Address
  death_date:
    name: death_date
    range: date
  description:
    name: description
    slot_uri: schema:description
  diagnosis:
    name: diagnosis
    range: DiagnosisConcept
    inlined: true
  driving_since:
    name: driving_since
    range: date
  duration:
    name: duration
    range: float
  employed_at:
    name: employed_at
    range: Organization
  ended_at_time:
    name: ended_at_time
    slot_uri: prov:endedAtTime
    range: date
  first_known_event:
    name: first_known_event
    range: date
  founding_date:
    name: founding_date
  founding_location:
    name: founding_location
    range: Place
  gender:
    name: gender
    slot_uri: schema:gender
    range: GenderType
  has_employment_history:
    name: has_employment_history
    range: EmploymentEvent
    multivalued: true
    inlined_as_list: true
  has_familial_relationships:
    name: has_familial_relationships
    range: FamilialRelationship
    multivalued: true
    inlined_as_list: true
  has_medical_history:
    name: has_medical_history
    range: MedicalEvent
    multivalued: true
    inlined_as_list: true
  id:
    name: id
    slot_uri: schema:identifier
    identifier: true
  image:
    name: image
    slot_uri: schema:image
  in_location:
    name: in_location
    range: Place
  is_current:
    name: is_current
    range: boolean
  label:
    name: label
    slot_uri: schema:name
  mission_statement:
    name: mission_statement
  organizations:
    name: organizations
    range: Organization
    multivalued: true
    inlined: true
    inlined_as_list: true
  parents:
    name: parents
    range: string
    multivalued: true
    inlined_as_list: true
  postal_code:
    name: postal_code
    range: string
  primary_email:
    name: primary_email
    slot_uri: schema:email
  procedure:
    name: procedure
    range: ProcedureConcept
    inlined: true
  related_to:
    name: related_to
  secondary_email:
    name: secondary_email
    slot_uri: schema:email
  started_at_time:
    name: started_at_time
    slot_uri: prov:startedAtTime
    range: date
  street:
    name: street
  study_name:
    name: study_name
    range: string
  type:
    name: type
classes:
  Address:
    name: Address
    slots:
    - street
    - city
    - postal_code
    - address_of
    class_uri: schema:PostalAddress
  Agent:
    name: Agent
    description: A person (alive, dead, undead, or fictional).
    in_subset:
    - basic_subset
    is_a: Entity
    mixins:
    - HasAliases
    slots:
    - primary_email
    - secondary_email
    - birth_date
    - death_date
    - age
    - gender
    - current_address
    - has_employment_history
    - has_familial_relationships
    - has_medical_history
    - parents
    - driving_since
    - first_known_event
    - study_name
    slot_usage:
      primary_email:
        name: primary_email
        pattern: ^\S+@[\S+\.]+\S+
      secondary_email:
        name: secondary_email
        pattern: ^\S+@[\S+\.]+\S+
    class_uri: schema:Person
  Concept:
    name: Concept
    is_a: NamedThing
  Container:
    name: Container
    slots:
    - agents
    - organizations
    tree_root: true
  DiagnosisConcept:
    name: DiagnosisConcept
    is_a: Concept
  EmploymentEvent:
    name: EmploymentEvent
    is_a: Event
    slots:
    - employed_at
  Entity:
    name: Entity
    description: Abstract base for derived target classes that live in the agent world,
      independent of any class hierarchy in the source schema.
    abstract: true
    slots:
    - id
    - label
    - description
  Event:
    name: Event
    close_mappings:
    - schema:Event
    slots:
    - started_at_time
    - ended_at_time
    - duration
    - is_current
  FamilialRelationship:
    name: FamilialRelationship
    is_a: Relationship
    slot_usage:
      related_to:
        name: related_to
        range: Agent
        required: true
      type:
        name: type
        range: FamilialRelationshipType
        required: true
  HasAliases:
    name: HasAliases
    description: A mixin applied to any class that can have aliases/alternateNames
    mixin: true
    attributes:
      aliases:
        name: aliases
        exact_mappings:
        - schema:alternateName
        multivalued: true
  MedicalEvent:
    name: MedicalEvent
    is_a: Event
    slots:
    - in_location
    - diagnosis
    - procedure
  NamedThing:
    name: NamedThing
    description: A generic grouping for any identifiable entity
    close_mappings:
    - schema:Thing
    slots:
    - id
    - label
    - description
    - image
  Organization:
    name: Organization
    description: An organization such as a company or university
    is_a: NamedThing
    mixins:
    - HasAliases
    slots:
    - mission_statement
    - founding_date
    - founding_location
    class_uri: schema:Organization
  Place:
    name: Place
    mixins:
    - HasAliases
    slots:
    - id
    - label
  ProcedureConcept:
    name: ProcedureConcept
    is_a: Concept
  Relationship:
    name: Relationship
    slots:
    - started_at_time
    - ended_at_time
    - related_to
    - type
  WithLocation:
    name: WithLocation
    mixin: true
    slots:
    - in_location
