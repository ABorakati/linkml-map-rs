id: https://example.org/src
name: src
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
imports:
- linkml:types

classes:
  Container:
    tree_root: true
    attributes:
      persons: {range: Person, multivalued: true, inlined_as_list: true}
      orgs: {range: Org, multivalued: true, inlined_as_list: true}
  Org:
    attributes:
      id: {range: string, identifier: true}
      name: {range: string}
      employees: {range: string}
      size: {range: string}
  Person:
    attributes:
      id: {range: string, identifier: true}
      org_id: {range: Org}
      code: {range: string}
