id: https://example.org/src
name: src
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
imports:
- linkml:types

classes:
  Org:
    attributes:
      id: {range: string, identifier: true}
      size: {range: string}
  Person:
    attributes:
      id: {range: string, identifier: true}
      name: {range: string}
      age: {range: integer}
  Student:
    is_a: Person
    attributes:
      school: {range: string}
