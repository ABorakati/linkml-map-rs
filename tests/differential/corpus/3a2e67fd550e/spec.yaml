id: https://example.org/spec
class_derivations:
  Agent:
    populated_from: Person
    joins:
      Org: {source_key: org_id, lookup_key: id}
      Country: {source_key: country_id, lookup_key: id}
    slot_derivations:
      id: {populated_from: id}
      inner:
        class_derivations:
          Inner:
            populated_from: Country

            slot_derivations:
              a: {populated_from: name}
              b: {populated_from: Country.label}
              c: {populated_from: Person.label}
