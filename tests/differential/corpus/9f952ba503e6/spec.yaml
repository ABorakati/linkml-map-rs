id: person-to-agent-flat
title: Person to Agent transformation (flat)
class_derivations:
- name: Agent
  populated_from: Person
  slot_derivations:
    id:
      name: id
    label:
      name: label
      populated_from: name
    email:
      name: email
      populated_from: primary_email
    age:
      name: age
      expr: str({age_in_years}) + ' years'
    gender:
      name: gender
