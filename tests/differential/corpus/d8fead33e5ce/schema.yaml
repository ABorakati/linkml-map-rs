id: https://example.org/src
name: src
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
imports:
- linkml:types
types:
  MyStr:
    typeof: string
    description: a string type
  MyInt:
    typeof: integer
classes:
  Person:
    attributes:
      id:
        range: string
        identifier: true
      ratio:
        range: float
      ratio2:
        range: float
  Order:
    attributes:
      id:
        range: string
        identifier: true
      born:
        range: date
      born2:
        range: date
      age:
        range: integer
