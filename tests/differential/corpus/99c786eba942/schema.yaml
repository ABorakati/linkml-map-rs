id: https://example.org/src
name: src
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
imports:
- linkml:types
classes:
  Person:
    attributes:
      id:
        range: string
        identifier: true
      name:
        range: string
      flag:
        range: boolean
      age:
        range: integer
        unit:
          ucum_code: kg
      amount:
        range: decimal
        unit:
          ucum_code: g
