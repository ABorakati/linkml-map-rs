id: scaffold-mapping
title: Minimal scaffold mapping
prefixes:
  src:
    key: src
    value: https://example.org/test-source-scaffold/
  tgt:
    key: tgt
    value: https://example.org/test-target-scaffold/
source_schema:
  name: https://example.org/test-source-scaffold
target_schema:
  name: https://example.org/test-target-scaffold
class_derivations:
- name: Agent
  populated_from: Person
  slot_derivations:
    id:
      name: id
    label:
      name: label
      populated_from: name
    _suffix:
      name: _suffix
      expr: '''!'''
      hide: true
    kind_label:
      name: kind_label
      expression_mappings:
        X:
          key: X
          value: '''extra'' + slot(''_suffix'')'
      populated_from: kind_code
