id: https://example.org/src
name: src
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
imports:
- linkml:types

classes:
  Address:
    attributes:
      street: {range: string}
      zip: {range: string}
  Person:
    attributes:
      id: {range: string, identifier: true}
      name: {range: string}
      age: {range: integer}
      tags: {range: string, multivalued: true}
      addr: {range: Address, inlined: true}
      max: {range: integer}
