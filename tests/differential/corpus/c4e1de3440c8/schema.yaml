id: https://example.org/src
name: src
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
imports:
- linkml:types
classes:
  Person:
    attributes:
      id:
        range: string
        identifier: true
      age:
        range: integer
      score:
        range: float
      flag:
        range: boolean
      when:
        range: string
      note:
        range: string
      order_ref:
        range: Order
  Order:
    attributes:
      id:
        range: string
        identifier: true
      name:
        range: string
