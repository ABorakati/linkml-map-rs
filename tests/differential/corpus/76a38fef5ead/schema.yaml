id: https://example.org/src
name: src
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
imports:
- linkml:types
default_range: string
types:
  MyStr:
    typeof: string
    description: a string type
  MyInt:
    typeof: integer
classes:
  Person:
    attributes:
      id:
        range: string
        identifier: true
      amount:
        range: decimal
      age:
        range: integer
      born:
        range: date
        multivalued: true
  Order:
    attributes:
      amount2:
        range: decimal
        unit:
          ucum_code: g
      rank:
        range: MyInt
    is_a: Person
