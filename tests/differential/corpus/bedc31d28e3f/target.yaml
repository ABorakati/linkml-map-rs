id: https://example.org/tgt
name: tgt
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://example.org/
default_prefix: ex
imports:
- linkml:types
classes:
  Agent:
    attributes:
      id: {range: string, identifier: true}
      org_name: {range: string}
      org_size: {range: integer}
      emp: {range: Employer, inlined: true}
  Employer:
    attributes:
      name: {range: string}
      size: {range: integer}
