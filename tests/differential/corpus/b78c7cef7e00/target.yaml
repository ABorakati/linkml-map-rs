name: lights-target
id: https://example.org/lights-target
imports:
- linkml:types
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
default_prefix: https://example.org/lights-target/
enums:
  SimplePrimary:
    name: SimplePrimary
    permissible_values:
      red:
        text: red
      green:
        text: green
      blue:
        text: blue
  SimpleSecondary:
    name: SimpleSecondary
    permissible_values:
      cyan:
        text: cyan
      magenta:
        text: magenta
  MissingnessTarget:
    name: MissingnessTarget
    permissible_values:
      na:
        text: na
      oth:
        text: oth
classes:
  Light:
    name: Light
    attributes:
      id:
        name: id
        identifier: true
        range: string
      color:
        name: color
        any_of:
        - range: SimplePrimary
        - range: SimpleSecondary
        - range: MissingnessTarget
      colors:
        name: colors
        multivalued: true
        any_of:
        - range: SimplePrimary
        - range: SimpleSecondary
        - range: MissingnessTarget
  Container:
    name: Container
    attributes:
      lights:
        name: lights
        range: Light
        multivalued: true
        inlined_as_list: true
    tree_root: true
