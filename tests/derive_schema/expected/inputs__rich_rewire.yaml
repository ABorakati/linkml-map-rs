name: rich-derived
id: https://example.org/rich-derived
imports:
- linkml:types
- ./rich_common
prefixes:
  ex:
    prefix_prefix: ex
    prefix_reference: https://example.org/rich/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
default_prefix: https://example.org/rich-derived/
default_range: string
classes:
  Worker:
    name: Worker
    description: An employee
    is_a: Human
    any_of:
    - slot_conditions:
        salary:
          name: salary
          minimum_value: 1
  Human:
    name: Human
    annotations:
      owner:
        tag: owner
        value: ex
    description: A person
    in_subset:
    - basic
    exact_mappings:
    - schema:Person
    class_uri: schema:Person
    tree_root: true
    unique_keys:
      nk:
        unique_key_name: nk
        unique_key_slots:
        - name
        - age
    rules:
    - preconditions:
        slot_conditions:
          age:
            name: age
            minimum_value: 18
      postconditions:
        slot_conditions:
          status:
            name: status
            equals_string: ADULT
