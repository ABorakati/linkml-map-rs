name: rich-derived
id: https://example.org/rich-derived
imports:
- linkml:types
- ./rich_common
prefixes:
  ex:
    prefix_prefix: ex
    prefix_reference: https://example.org/rich/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
default_prefix: https://example.org/rich-derived/
default_range: string
types:
  Mass:
    name: Mass
    description: a mass
    from_schema: https://example.org/rich
    typeof: float
    uri: xsd:float
enums:
  Status:
    name: Status
    annotations:
      kind:
        tag: kind
        value: lifecycle
    description: Status values
    from_schema: https://example.org/rich
    permissible_values:
      ACTIVE:
        text: ACTIVE
        description: Active
        meaning: ex:active
      INACTIVE:
        text: INACTIVE
        description: Inactive
      ADULT:
        text: ADULT
  Unused:
    name: Unused
    from_schema: https://example.org/rich
    permissible_values:
      X:
        text: X
      Y:
        text: Y
slots:
  name:
    name: name
    annotations:
      note:
        tag: note
        value: free text
    description: The name
    from_schema: https://example.org/rich
    aliases:
    - label
    - title
    exact_mappings:
    - schema:name
    slot_uri: schema:name
    range: string
    required: true
  age:
    name: age
    from_schema: https://example.org/rich
    ifabsent: int(0)
    range: integer
    minimum_value: 0
    maximum_value: 150
  weight:
    name: weight
    from_schema: https://example.org/rich
    range: Mass
    unit:
      ucum_code: kg
  friends:
    name: friends
    from_schema: https://example.org/rich
    range: Person
    multivalued: true
    inlined_as_list: true
  status:
    name: status
    from_schema: https://example.org/rich
    range: Status
  tags:
    name: tags
    todos:
    - review
    comments:
    - a comment
    - another
    examples:
    - value: abc
      description: an example
    from_schema: https://example.org/rich
    multivalued: true
    pattern: ^[a-z]+$
classes:
  Person:
    name: Person
    annotations:
      owner:
        tag: owner
        value: ex
    description: A person
    in_subset:
    - basic
    from_schema: https://example.org/rich
    exact_mappings:
    - schema:Person
    slots:
    - name
    - age
    - friends
    - weight
    - status
    slot_usage:
      name:
        name: name
        description: Required name
        required: true
    attributes:
      nickname:
        name: nickname
        description: An attribute only on Person
        from_schema: https://example.org/rich
        range: string
      name:
        name: name
        annotations:
          note:
            tag: note
            value: free text
        description: The name
        aliases:
        - label
        - title
        exact_mappings:
        - schema:name
        slot_uri: schema:name
        range: string
        required: true
    class_uri: schema:Person
    tree_root: true
    unique_keys:
      nk:
        unique_key_name: nk
        unique_key_slots:
        - name
        - age
    rules:
    - preconditions:
        slot_conditions:
          age:
            name: age
            minimum_value: 18
      postconditions:
        slot_conditions:
          status:
            name: status
            equals_string: ADULT
  HasTags:
    name: HasTags
    from_schema: https://example.org/rich
    mixin: true
    slots:
    - tags
  Employee:
    name: Employee
    description: An employee
    from_schema: https://example.org/rich
    is_a: Person
    attributes:
      salary:
        name: salary
        from_schema: https://example.org/rich
        range: integer
      department:
        name: department
        from_schema: https://example.org/rich
        range: string
    any_of:
    - slot_conditions:
        salary:
          name: salary
          minimum_value: 1
  Container:
    name: Container
    from_schema: https://example.org/rich
    attributes:
      persons:
        name: persons
        from_schema: https://example.org/rich
        range: Person
        multivalued: true
        inlined: true
      employees:
        name: employees
        from_schema: https://example.org/rich
        range: Employee
        multivalued: true
        inlined_as_list: true
    tree_root: true
