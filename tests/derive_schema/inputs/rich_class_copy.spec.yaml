id: https://example.org/spec/class_copy
class_derivations:
  Person:
    populated_from: Person
    copy_directives:
      d:
        element_name: d
        copy_all: true
  Employee:
    populated_from: Employee
    copy_directives:
      d:
        element_name: d
        include: [salary]
    slot_derivations:
      pay:
        populated_from: salary
        range: float
  Person2:
    populated_from: Container
    copy_directives:
      d:
        element_name: d
        copy_all: true
        exclude: [nickname, friends]
