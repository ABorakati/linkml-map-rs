id: https://example.org/rich
name: rich
title: A rich schema
description: Exercises many metamodel fields
prefixes:
  ex: https://example.org/rich/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: ex
default_range: string
imports:
  - linkml:types
  - ./rich_common
subsets:
  basic:
    description: basic subset
types:
  Mass:
    typeof: float
    description: a mass
    uri: xsd:float
slots:
  name:
    description: The name
    range: string
    required: true
    slot_uri: schema:name
    aliases: [label, title]
    exact_mappings:
      - schema:name
    annotations:
      note: free text
  age:
    range: integer
    minimum_value: 0
    maximum_value: 150
    ifabsent: int(0)
  weight:
    range: Mass
    unit:
      ucum_code: kg
  friends:
    range: Person
    multivalued: true
    inlined_as_list: true
  status:
    range: Status
  tags:
    multivalued: true
    pattern: "^[a-z]+$"
    todos: ["review"]
    comments: ["a comment", "another"]
    examples:
      - value: abc
        description: an example
classes:
  Person:
    is_a: Base
    mixins:
      - HasTags
    description: A person
    in_subset:
      - basic
    class_uri: schema:Person
    slots:
      - name
      - age
      - friends
      - weight
      - status
    slot_usage:
      name:
        required: true
        description: Required name
    attributes:
      nickname:
        range: string
        description: An attribute only on Person
    unique_keys:
      nk:
        unique_key_slots: [name, age]
    rules:
      - preconditions:
          slot_conditions:
            age:
              minimum_value: 18
        postconditions:
          slot_conditions:
            status:
              equals_string: ADULT
    annotations:
      owner: ex
    tree_root: true
    exact_mappings:
      - schema:Person
  HasTags:
    mixin: true
    slots:
      - tags
  Employee:
    is_a: Person
    description: An employee
    attributes:
      salary:
        range: integer
      department:
        range: string
    any_of:
      - slot_conditions:
          salary:
            minimum_value: 1
  Container:
    tree_root: true
    attributes:
      persons:
        range: Person
        multivalued: true
        inlined: true
      employees:
        range: Employee
        multivalued: true
        inlined_as_list: true
enums:
  Status:
    description: Status values
    permissible_values:
      ACTIVE:
        description: Active
        meaning: ex:active
      INACTIVE:
        description: Inactive
      ADULT:
    annotations:
      kind: lifecycle
  Unused:
    permissible_values:
      X:
      Y:
